name: check

# Parsing tests on saved pages (pytest). GeM answers only from India, so GitHub's runners (US/EU) can't reach it and the
# template's scrape-check step (2 real items against a local stand-in hub) is not run here; the work itself runs on the pool's
# India servers (geo="IN" in family.py). Run it by hand too: Actions -> check -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@main#subdirectory=sdk"
          python3 -c "import json; [print(c) for c in json.load(open('scrape.json')).get('setup', [])]" | grep -v "requirements.txt" | while IFS= read -r cmd; do bash -c "$cmd"; done
      - name: Parsing tests
        run: python -m pytest tests -q
      - name: Scripts and queue build
        run: python -m py_compile results.py pdfs.py gemcommon.py gemresult.py family.py setup_family.py && python -c "from family import PROJECTS, items; print({p['name']: len(items(p['list'])) for p in PROJECTS})"
